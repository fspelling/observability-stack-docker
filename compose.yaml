services:
  api:
    image: fspelling/vertical-slice-api:v1
    ports:
      - "5193:5193"
    depends_on: 
     - jaeger
     - gerador-nome
     - gerador-documento
    networks:
      - observability

  gerador-nome:
    image: fabricioveronez/gerador-nome:latest
    environment:
      JAEGER_HOST: "jaeger"
      JAEGER_PORT: "JAEGER_PORT"
      JAEGER_SERVICE_NAME: "gerador-nome"       
    networks:
      - observability
    depends_on: 
     - jaeger  
    ports:
      - 5001:5000
      
  gerador-documento:
    image: fabricioveronez/gerador-documento:latest
    environment:
      URL_GERADOR_CPF: "gerador-cpf:5000"
      URL_GERADOR_RG: "gerador-rg:5000"
      JAEGER_HOST: "jaeger"
      JAEGER_PORT: "JAEGER_PORT"
      JAEGER_SERVICE_NAME: "gerador-documento"       
    networks:
      - observability
    depends_on: 
     - jaeger
     - gerador-cpf
     - gerador-rg      
    ports:
      - 5002:5000

  gerador-cpf:
    image: fabricioveronez/gerador-cpf:latest
    networks:
      - observability   
    environment:
      JAEGER_HOST: "jaeger"
      JAEGER_PORT: "JAEGER_PORT"
      JAEGER_SERVICE_NAME: "gerador-cpf"        
    depends_on: 
     - jaeger    
    ports:
      - 5003:5000  
      
  gerador-rg:
    image: fabricioveronez/gerador-rg:latest
    environment:
      JAEGER_HOST: "jaeger"
      JAEGER_PORT: "JAEGER_PORT"
      JAEGER_SERVICE_NAME: "gerador-rg"        
    networks:
      - observability
    depends_on: 
     - jaeger      
    ports:
      - 5004:5000

  promtail:
    image: grafana/promtail:2.0.0
    ports:
      - 9080:9080
    command:
      - -config.file=/etc/promtail/config.yaml
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail:/etc/promtail
      - ./tmp:/tmp
    networks:
      - observability

  loki:
    image: grafana/loki:2.0.0
    ports:
      - "3100:3100"
    command:
      - -config.file=/etc/loki/local-config.yaml
      - -print-config-stderr=true
    networks:
      - observability

  prometheus:
    image: prom/prometheus:v2.24.1
    ports:
      - "9090:9090"
    depends_on:
      - api
    volumes:
      - ./prometheus:/etc/prometheus
    networks:
      - observability

  alertmanager:
    image: prom/alertmanager:v0.21.0
    ports:
      - "9093:9093"
    volumes:
      - ./prometheus/alertmanager.yaml:/prometheus/alertmanager.yml
    command:
      - '--config.file=/prometheus/alertmanager.yml'
    networks:
      - observability

  jaeger:
    image: jaegertracing/all-in-one:1.28
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "16686:16686"
      - "14268:14268"
      - "9411:9411"

networks:
  observability:
    driver: bridge
