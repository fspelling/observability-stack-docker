services:
  api:
    image: fspelling/vertical-slice-api:v1
    ports:
      - "5193:5193"
    networks:
      - observability

  promtail:
    image: grafana/promtail:2.0.0
    ports:
      - 9080:9080
    command:
      - -config.file=/etc/promtail/config.yaml
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail:/etc/promtail
      - ./tmp:/tmp
    networks:
      - observability

  loki:
    image: grafana/loki:2.0.0
    ports:
      - "3100:3100"
    command:
      - -config.file=/etc/loki/local-config.yaml
      - -print-config-stderr=true
    networks:
      - observability

  prometheus:
    image: prom/prometheus:v2.24.1
    ports:
      - "9090:9090"
    depends_on:
      - api
    volumes:
      - ./prometheus:/etc/prometheus
    networks:
      - observability

  alertmanager:
    image: prom/alertmanager:v0.21.0
    ports:
      - "9093:9093"
    volumes:
      - ./prometheus/alertmanager.yaml:/prometheus/alertmanager.yml
    command:
      - '--config.file=/prometheus/alertmanager.yml'
    networks:
      - observability

  jaeger:
    image: jaegertracing/all-in-one:1.28
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "16686:16686"
      - "14268:14268"
      - "9411:9411"

networks:
  observability:
    driver: bridge
