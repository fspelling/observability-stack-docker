services:
  api:
    image: fspelling/vertical-slice-api:latest
    ports:
      - "8080:80"
    networks:
      - observability
    volumes:
      - "./logs/api:/log"
  
  loki:
    image: grafana/loki:2.0.0
    ports:
      - "3100:3100"
    command:
      - -config.file=/etc/loki/local-config.yaml
      - -print-config-stderr=true
    networks:
      - observability

  promtail:
    image: grafana/promtail:2.0.0
    ports:
      - 9080:9080
    command:
      - -config.file=/etc/promtail/config.yaml
    volumes:
      - "./promtail/config.yaml:/etc/promtail/config.yaml"
      - "./logs/api:/logs/api"
      - "./tmp:/tmp"
    networks:
      - observability

networks:
  observability:
    driver: bridge
